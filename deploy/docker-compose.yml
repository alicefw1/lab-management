services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lab_equipment
      MYSQL_USER: labapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在.env中设置DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../01_数据库脚本/lab_equipment_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../01_数据库脚本/02_academic_asset_upgrade.sql:/docker-entrypoint-initdb.d/02-upgrade.sql:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-ulabapp","-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ../02_后端工程 lab-reserve-server（Spring Boot + MyBatis）
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lab_equipment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: labapp
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在.env中设置至少32字节的JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?请在.env中设置PUBLIC_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ../03_前端工程完整代码:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]

volumes:
  mysql_data:
