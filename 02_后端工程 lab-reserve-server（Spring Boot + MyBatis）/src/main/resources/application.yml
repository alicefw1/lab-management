server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lab_equipment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

app:
  jwt:
    secret: ${JWT_SECRET:LabReserve-Local-Development-Key-Change-Before-Production-2026}
    expire-millis: ${JWT_EXPIRE_MILLIS:43200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lab.reserve.entity
  configuration:
    map-underscore-to-camel-case: true

