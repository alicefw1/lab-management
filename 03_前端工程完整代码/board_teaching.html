<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>实验教学与资产运维中心</title>
  <link rel="stylesheet" href="assets/app.css">
  <style>
    body{margin:0;min-height:100vh;background:#07111f;color:#dcecff;font-family:"Microsoft YaHei",sans-serif}
    .shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:24px}.top .back{margin-left:auto}
    .tabs,.actions{display:flex;gap:10px;flex-wrap:wrap}.tab,.action{border:1px solid #284761;background:#10243a;color:#b9d7ef;border-radius:9px;padding:10px 15px;cursor:pointer}.tab.active,.action.primary{background:#19d3da;color:#05131e;border-color:#19d3da;font-weight:700}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin:20px 0}.metric,.panel{background:rgba(14,34,54,.92);border:1px solid #244864;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.2)}.metric{padding:18px}.metric strong{display:block;font-size:30px;color:#54e8ee;margin-top:7px}.panel{padding:18px;margin-top:16px}.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.panel-head h2{font-size:18px;margin:0}.panel-head .actions{margin-left:auto}
    table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px 10px;border-bottom:1px solid #203d54;text-align:left;font-size:14px}th{color:#80bfdc}.table-wrap{overflow:auto}.empty{text-align:center;padding:40px;color:#7594aa}.badge{padding:4px 9px;border-radius:20px;background:#1b4053;color:#78edf0;font-size:12px}.danger{color:#ff8190}.hidden{display:none!important}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:10000;display:grid;place-items:center;padding:20px}.dialog{width:min(650px,96vw);max-height:90vh;overflow:auto;background:#0e2337;border:1px solid #2a5873;border-radius:16px;padding:24px}.dialog h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:#8eb3ca;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #315269;border-radius:8px;background:#091827;color:#e7f6ff}.field textarea{min-height:110px}.wide{grid-column:1/-1}.dialog .actions{justify-content:flex-end;margin-top:18px}
    @media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.shell{padding:14px}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div><h1>实验教学与资产运维中心</h1><div id="welcome" style="color:#789bb1;margin-top:6px"></div></div><a class="action back" id="back">返回角色工作台</a></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="schedules">实验安排</button><button class="tab" data-view="reports">报告与成绩</button>
    <button class="tab manager" data-view="classes">班级管理</button><button class="tab teacher" data-view="projects">实验项目</button>
    <button class="tab asset" data-view="maintenance">设备维护</button><button class="tab asset" data-view="suppliers">供应商</button>
  </div>
  <section class="summary"><div class="metric">实验安排<strong id="mSchedule">-</strong></div><div class="metric">已签到<strong id="mAttendance">-</strong></div><div class="metric">实验报告<strong id="mReport">-</strong></div><div class="metric">平均成绩<strong id="mScore">-</strong></div></section>
  <section class="panel"><div class="panel-head"><h2 id="viewTitle">实验安排</h2><div class="actions" id="viewActions"></div></div><div class="table-wrap" id="content"><div class="empty">正在加载…</div></div></section>
</main><div id="modalRoot"></div>
<script src="assets/api.js"></script>
<script>
const API=Api;
const user=getLoginUser(); if(!requireLogin()) throw new Error('未登录');
const role=user.roleCode, isManager=['ADMIN','DEPARTMENT_HEAD'].includes(role), isTeacher=['TEACHER','ADMIN','DEPARTMENT_HEAD'].includes(role), isAsset=['LAB_ADMIN','ADMIN','DEPARTMENT_HEAD'].includes(role);
document.getElementById('welcome').textContent=`${user.realName||user.username} · ${roleCodeToName(role)}`; document.getElementById('back').href=getRolePage(role);
document.querySelectorAll('.manager').forEach(x=>x.classList.toggle('hidden',!isManager)); document.querySelectorAll('.teacher').forEach(x=>x.classList.toggle('hidden',!isTeacher)); document.querySelectorAll('.asset').forEach(x=>x.classList.toggle('hidden',!isAsset));
const pick=(o,...ks)=>{for(const k of ks)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return ''};
const rows=(items,render,span=8)=>items.length?items.map(render).join(''):`<tr><td colspan="${span}" class="empty">暂无数据</td></tr>`;
function notify(msg,err=false){if(typeof toast==='function')toast(msg,err?'error':'success');else alert(msg)}
function form(title,fields,submit){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal"><form class="dialog"><h3>${esc(title)}</h3><div class="grid">${fields.map(f=>`<div class="field ${f.wide?'wide':''}"><label>${esc(f.label)}</label>${f.type==='textarea'?`<textarea name="${f.name}" ${f.required?'required':''}>${esc(f.value||'')}</textarea>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" ${f.required?'required':''}>`}</div>`).join('')}</div><div class="actions"><button type="button" class="action cancel">取消</button><button class="action primary">保存</button></div></form></div>`;root.querySelector('.cancel').onclick=()=>root.innerHTML='';root.querySelector('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await submit(data);root.innerHTML='';notify('操作成功');load(current)}catch(x){notify(x.message,true)}}}
async function loadSummary(){try{const d=await API.getAcademicSummary();document.getElementById('mSchedule').textContent=pick(d,'schedule_count','scheduleCount')||0;document.getElementById('mAttendance').textContent=pick(d,'attendance_count','attendanceCount')||0;document.getElementById('mReport').textContent=pick(d,'report_count','reportCount')||0;document.getElementById('mScore').textContent=pick(d,'average_score','averageScore')||'-'}catch(e){notify(e.message,true)}}
let current='schedules'; document.getElementById('tabs').onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');current=e.target.dataset.view;load(current)};
const action=(label,fn)=>{const b=document.createElement('button');b.className='action primary';b.textContent=label;b.onclick=fn;document.getElementById('viewActions').appendChild(b)};
async function load(view){document.getElementById('content').innerHTML='<div class="empty">正在加载…</div>';document.getElementById('viewActions').innerHTML='';try{await ({schedules, reports, classes, projects, maintenance, suppliers}[view])()}catch(e){document.getElementById('content').innerHTML=`<div class="empty danger">${esc(e.message)}</div>`}}
async function schedules(){document.getElementById('viewTitle').textContent='实验安排';if(isTeacher||role==='LAB_ADMIN')action('新建实验安排',()=>form('新建实验安排',[{name:'projectId',label:'实验项目ID',type:'number',required:1},{name:'classId',label:'班级ID',type:'number',required:1},{name:'labId',label:'实验室ID',type:'number',required:1},{name:'teacherId',label:'教师用户ID',type:'number'},{name:'startTime',label:'开始时间',type:'datetime-local',required:1},{name:'endTime',label:'结束时间',type:'datetime-local',required:1},{name:'requirements',label:'实验要求',type:'textarea',wide:1}],d=>API.saveSchedule(d)));const d=await API.getSchedules();document.getElementById('content').innerHTML=`<table><thead><tr><th>ID</th><th>实验项目</th><th>班级</th><th>实验室</th><th>教师</th><th>时间</th><th>签到/报告</th><th>操作</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${x.id}</td><td>${esc(pick(x,'project_name','projectName'))}</td><td>${esc(pick(x,'class_name','className'))}</td><td>${esc(pick(x,'lab_name','labName'))}</td><td>${esc(pick(x,'teacher_name','teacherName'))}</td><td>${formatDate(pick(x,'start_time','startTime'))}<br>${formatDate(pick(x,'end_time','endTime'))}</td><td>${pick(x,'present_count','presentCount')||0} / ${pick(x,'report_count','reportCount')||0}</td><td>${role==='STUDENT'?`<button class="action" onclick="checkin(${x.id})">签到</button> <button class="action" onclick="report(${x.id})">写报告</button>`:`<button class="action" onclick="attendance(${x.id})">考勤</button>`}</td></tr>`)}</tbody></table>`}
async function checkin(id){try{await API.checkIn(id);notify('签到成功');loadSummary();load('schedules')}catch(e){notify(e.message,true)}}
function report(id){form('提交实验报告',[{name:'title',label:'报告标题',required:1,wide:1},{name:'content',label:'实验过程、结果分析与结论',type:'textarea',required:1,wide:1},{name:'attachmentUrl',label:'附件链接（可选）',wide:1}],d=>API.submitExperimentReport({...d,scheduleId:id}))}
async function attendance(id){const d=await API.getAttendance(id);document.getElementById('viewTitle').textContent='学生考勤登记';document.getElementById('content').innerHTML=`<table><thead><tr><th>学号</th><th>姓名</th><th>状态</th><th>签到时间</th><th>操作</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${esc(x.username)}</td><td>${esc(pick(x,'real_name','realName'))}</td><td>${esc(x.status||'未登记')}</td><td>${formatDate(pick(x,'check_in_time','checkInTime'))}</td><td><button class="action" onclick="mark(${id},${pick(x,'student_id','studentId')},'PRESENT')">出勤</button> <button class="action" onclick="mark(${id},${pick(x,'student_id','studentId')},'ABSENT')">缺勤</button> <button class="action" onclick="mark(${id},${pick(x,'student_id','studentId')},'LATE')">迟到</button></td></tr>`)}</tbody></table>`}
async function mark(scheduleId,studentId,status){try{await API.markAttendance({scheduleId,studentId,status});attendance(scheduleId)}catch(e){notify(e.message,true)}}
async function reports(){document.getElementById('viewTitle').textContent='实验报告与成绩';const d=await API.getExperimentReports();document.getElementById('content').innerHTML=`<table><thead><tr><th>报告</th><th>实验项目</th><th>学生</th><th>提交时间</th><th>状态</th><th>成绩</th><th>教师评语</th><th>操作</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${esc(x.title)}</td><td>${esc(pick(x,'project_name','projectName'))}</td><td>${esc(pick(x,'student_name','studentName'))}</td><td>${formatDate(pick(x,'submit_time','submitTime'))}</td><td><span class="badge">${Number(x.status)===2?'已批改':'已提交'}</span></td><td>${x.score??'-'}</td><td>${esc(x.feedback||'-')}</td><td>${isTeacher?`<button class="action" onclick="grade(${x.id})">批改</button>`:'-'}</td></tr>`)}</tbody></table>`}
function grade(id){form('批改实验报告',[{name:'score',label:'成绩（0-100）',type:'number',required:1},{name:'feedback',label:'教师评语',type:'textarea',required:1,wide:1}],d=>API.gradeExperimentReport({...d,reportId:id}))}
async function classes(){document.getElementById('viewTitle').textContent='班级管理';action('新建班级',()=>form('新建班级',[{name:'className',label:'班级名称',required:1},{name:'gradeYear',label:'年级',type:'number',required:1},{name:'majorName',label:'专业'},{name:'departmentName',label:'院系'},{name:'counselorId',label:'辅导员用户ID',type:'number'}],API.saveClass));const d=await API.getClasses();document.getElementById('content').innerHTML=`<table><thead><tr><th>ID</th><th>班级</th><th>年级</th><th>专业</th><th>院系</th><th>学生数</th><th>操作</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${x.id}</td><td>${esc(pick(x,'class_name','className'))}</td><td>${pick(x,'grade_year','gradeYear')}</td><td>${esc(pick(x,'major_name','majorName'))}</td><td>${esc(pick(x,'department_name','departmentName'))}</td><td>${pick(x,'student_count','studentCount')||0}</td><td><button class="action" onclick="addStudent(${x.id})">添加学生</button></td></tr>`)}</tbody></table>`}
function addStudent(classId){form('添加班级学生',[{name:'studentId',label:'学生用户ID',type:'number',required:1}],d=>API.addClassStudent(classId,d.studentId))}
async function projects(){document.getElementById('viewTitle').textContent='实验项目库';action('新建实验项目',()=>form('新建实验项目',[{name:'projectCode',label:'项目编号'},{name:'projectName',label:'项目名称',required:1},{name:'courseName',label:'课程名称'},{name:'hours',label:'学时',type:'number'},{name:'objectives',label:'教学目标',type:'textarea',wide:1},{name:'safetyNotes',label:'安全事项',type:'textarea',wide:1}],API.saveProject));const d=await API.getProjects();document.getElementById('content').innerHTML=`<table><thead><tr><th>ID</th><th>编号</th><th>项目名称</th><th>课程</th><th>学时</th><th>教学目标</th><th>安全事项</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${x.id}</td><td>${esc(pick(x,'project_code','projectCode'))}</td><td>${esc(pick(x,'project_name','projectName'))}</td><td>${esc(pick(x,'course_name','courseName'))}</td><td>${x.hours}</td><td>${esc(x.objectives||'')}</td><td>${esc(pick(x,'safety_notes','safetyNotes'))}</td></tr>`)}</tbody></table>`}
async function maintenance(){document.getElementById('viewTitle').textContent='设备预防性维护';action('新建维护计划',()=>form('新建维护计划',[{name:'deviceId',label:'设备ID',type:'number',required:1},{name:'planName',label:'计划名称',required:1},{name:'cycleDays',label:'周期（天）',type:'number'},{name:'nextDate',label:'下次维护日期',type:'date',required:1},{name:'responsibleName',label:'负责人'},{name:'content',label:'维护内容',type:'textarea',wide:1}],API.saveMaintenancePlan));const d=await API.getMaintenancePlans();document.getElementById('content').innerHTML=`<table><thead><tr><th>设备</th><th>计划</th><th>周期</th><th>上次维护</th><th>下次维护</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${esc(pick(x,'device_name','deviceName'))}<br>${esc(pick(x,'device_no','deviceNo'))}</td><td>${esc(pick(x,'plan_name','planName'))}</td><td>${pick(x,'cycle_days','cycleDays')}天</td><td>${pick(x,'last_date','lastDate')||'-'}</td><td class="${Number(x.overdue)?'danger':''}">${pick(x,'next_date','nextDate')}</td><td>${esc(pick(x,'responsible_name','responsibleName'))}</td><td>${Number(x.overdue)?'已逾期':'正常'}</td><td><button class="action" onclick="completePlan(${x.id})">维护登记</button></td></tr>`)}</tbody></table>`}
function completePlan(planId){form('完成维护登记',[{name:'result',label:'维护结果',required:1},{name:'cost',label:'费用',type:'number'},{name:'content',label:'维护过程',type:'textarea',wide:1}],d=>API.completeMaintenance({...d,planId}))}
async function suppliers(){document.getElementById('viewTitle').textContent='供应商管理';if(isManager)action('新建供应商',()=>form('新建供应商',[{name:'supplierCode',label:'供应商编号'},{name:'supplierName',label:'供应商名称',required:1},{name:'contactName',label:'联系人'},{name:'phone',label:'电话'},{name:'email',label:'邮箱',type:'email'},{name:'rating',label:'评分',type:'number'},{name:'businessScope',label:'经营范围',type:'textarea',wide:1}],API.saveSupplier));const d=await API.getSuppliers();document.getElementById('content').innerHTML=`<table><thead><tr><th>编号</th><th>供应商</th><th>联系人</th><th>电话</th><th>邮箱</th><th>经营范围</th><th>评分</th></tr></thead><tbody>${rows(d,x=>`<tr><td>${esc(pick(x,'supplier_code','supplierCode'))}</td><td>${esc(pick(x,'supplier_name','supplierName'))}</td><td>${esc(pick(x,'contact_name','contactName'))}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(pick(x,'business_scope','businessScope'))}</td><td>${x.rating}</td></tr>`)}</tbody></table>`}
loadSummary();load(current);
</script></body></html>
